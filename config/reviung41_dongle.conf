# Enable RGB underglow control code (so keymap behaviors compile)
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n


# Disable sleep on the dongle (always powered via USB)
CONFIG_ZMK_SLEEP=n

# Boost Bluetooth transmission power to +8dBm
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enable display support
CONFIG_ZMK_DISPLAY=y
CONFIG_SPI=y
CONFIG_MIPI_DBI=y
CONFIG_MIPI_DBI_SPI=y
CONFIG_ST7789V=y
CONFIG_ZMK_DONGLE_DISPLAY_DONGLE_BATTERY=n

# LVGL Color Settings for ST7789V (16-bit color depth)
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_Z_BITS_PER_PIXEL=16
CONFIG_LV_Z_MEM_POOL_SIZE=16384
CONFIG_LV_Z_VDB_SIZE=10

# Configure dongle to connect to 1 peripheral half (reviung41 keyboard)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=1

