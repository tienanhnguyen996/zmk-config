# Enable RGB underglow control code (so keymap behaviors compile)
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Boost Bluetooth transmission power to +8dBm
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enable split central role
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=1

# Enable USB logging for debugging
CONFIG_ZMK_USB_LOGGING=y

# Temporarily clear bonds on boot to remove obsolete keyboard MAC address
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=y
