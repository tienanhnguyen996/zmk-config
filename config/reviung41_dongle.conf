# Enable RGB underglow control code (so keymap behaviors compile)
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n


# Disable sleep on the dongle (always powered via USB)
CONFIG_ZMK_SLEEP=n

# Boost Bluetooth transmission power to +8dBm
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enable display support
CONFIG_ZMK_DISPLAY=y
CONFIG_SSD1306=y
CONFIG_ZMK_DONGLE_DISPLAY_DONGLE_BATTERY=y

# Configure dongle to connect to both peripheral halves
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

